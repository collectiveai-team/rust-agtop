name: Bump Version and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (without v prefix, e.g. 0.6.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-and-tag:
    name: Bump Cargo.toml and push tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token with push access to main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Version '$VERSION' is not in semver format (e.g. 0.6.0)"
            exit 1
          fi

      - name: Check version is not already released
        run: |
          VERSION="${{ inputs.version }}"
          if git tag --list "v$VERSION" | grep -q "v$VERSION"; then
            echo "ERROR: Tag v$VERSION already exists."
            exit 1
          fi

      - name: Bump version in Cargo.toml
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Cargo.toml updated to version $VERSION"
          grep '^version' Cargo.toml

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          VERSION="${{ inputs.version }}"
          git add Cargo.toml
          git commit -m "chore: release v$VERSION"

      - name: Push commit to main
        run: git push origin HEAD:main

      - name: Create and push tag
        run: |
          VERSION="${{ inputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
